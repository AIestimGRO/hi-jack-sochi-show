name: SOCHI SHOW tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python tests
        run: python -m pytest -q
      - name: Check JavaScript syntax
        run: |
          node --check sochi_show/static/admin.js
          node --check sochi_show/static/screen.js
          node --check sochi_show/static/green-show.js
          node --check sochi_show/static/green-preview.js
      - name: GREEN visual smoke tests
        run: node tests/test_green_visual.mjs
