name: SOCHI SHOW tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python tests
        run: python -m pytest -q
      - name: Check JavaScript syntax
        run: |
          node --check sochi_show/static/admin.js
          node --check sochi_show/static/screen.js
          node --check sochi_show/static/green-show.js
          node --check sochi_show/static/rank-mascots.js
          node --check sochi_show/static/jack-sword-motion.js
          node --check sochi_show/static/green-preview.js
          node --check sochi_show/static/blue-show.js
          node --check sochi_show/static/blue-preview.js
          node --check sochi_show/static/red-show.js
          node --check sochi_show/static/red-preview.js
          node --check sochi_show/static/secret-show.js
          node --check sochi_show/static/secret-preview.js
      - name: GREEN visual smoke tests
        run: node tests/test_green_visual.mjs
      - name: BLUE visual smoke tests
        run: node tests/test_blue_visual.mjs
      - name: RED visual smoke tests
        run: node tests/test_red_visual.mjs
      - name: SECRET JACK visual smoke tests
        run: node tests/test_secret_visual.mjs
